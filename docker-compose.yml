services:
  app:
    build: .
    container_name: word_memorize_laravel
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - shared-laravel-net

  web:
    image: nginx:latest
    container_name: word_memorize_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - shared-laravel-net

  node:
    image: node:22
    container_name: word_memorize_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    command: tail -f /dev/null
    networks:
      - shared-laravel-net

  db:
    image: mysql:8.0
    container_name: word_memorize_db
    restart: always
    environment:
      MYSQL_DATABASE: fluentoo_edu
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - shared-laravel-net

volumes:
  dbdata:
  node_modules:

networks:
  shared-laravel-net:
    external: true